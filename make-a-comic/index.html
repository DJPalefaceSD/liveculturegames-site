<style>
/* The game's own look: dark desk, mint for the act, purple for the step you are on,
   gold for what you made. Tokens only; both themes. */
:root {
  --bg: #0f1218; --panel: #1a2030; --panel2: #232b3e; --ink: #ecebe6; --dim: #a3abba;
  --mint: #5ed6a0; --mint-ink: #0c2a1c; --creative: #a98bf0; --creative-ink: #1b1030;
  --gold: #f2c230; --info: #5aa8ff; --info-ink: #06203d; --quiet: #3a4458; --line: #2e3850;
  --paper: #f4efe4;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3efe6; --panel: #ffffff; --panel2: #ece6da; --ink: #1c1f26; --dim: #5a6070;
    --mint: #2fae78; --mint-ink: #ffffff; --creative: #6b4fc8; --creative-ink: #ffffff;
    --gold: #9a6a00; --info: #2a6fd0; --info-ink: #ffffff; --quiet: #d6d0c4; --line: #d6d0c4;
  }
}
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 18px/1.45 "Bitter", Georgia, serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px; }
header.top { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; margin: .4rem 0 1rem; }
header.top h1 { margin: 0; font-size: 2.1rem; color: var(--creative); font-weight: 600; }
header.top .by { color: var(--dim); }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tab { min-height: 2.8rem; padding: .35rem .95rem; border: 0; border-radius: 10px; font: 600 1rem "Bitter", Georgia, serif; letter-spacing: .04em;
  background: var(--quiet); color: var(--ink); cursor: pointer; }
.tab.done { background: var(--mint); color: var(--mint-ink); }
.tab.on { background: var(--creative); color: var(--creative-ink); }
.layout { display: grid; grid-template-columns: 330px 1fr; gap: 18px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .comic { order: 2; } }
.comic, .panel { background: var(--panel); border-radius: 14px; padding: 18px; }
.comic { border: 2px solid var(--gold); position: sticky; top: 12px; }
@media (max-width: 860px) { .comic { position: static; } }
.comic h2 { margin: 0 0 .6rem; color: var(--gold); font-size: 1.4rem; letter-spacing: .04em; }
.cover-frame svg, .printed-cover svg { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.facts { margin: .9rem 0 0; }
.facts dt { color: var(--dim); font-size: .8rem; letter-spacing: .08em; margin-top: .55rem; }
.facts dd { margin: 0; }
.panel { border: 2px solid var(--creative); outline: none; }
.step-title { margin: 0 0 1rem; color: var(--creative); font-size: 1.9rem; font-weight: 600; }
.split { display: grid; grid-template-columns: 240px 1fr; gap: 18px; align-items: start; }
@media (max-width: 640px) { .split { grid-template-columns: 1fr; } .figure-frame { max-width: 240px; margin: 0 auto; } }
.figure-frame svg { width: 100%; height: auto; display: block; border-radius: 10px; }
.row { margin-bottom: .9rem; }
.lab { color: var(--dim); font-size: .8rem; letter-spacing: .08em; margin-bottom: .3rem; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { min-height: 2.6rem; padding: .3rem .8rem; border: 0; border-radius: 999px; background: var(--panel2); color: var(--ink);
  font: 500 .95rem "Bitter", Georgia, serif; cursor: pointer; }
.pill:hover { filter: brightness(1.15); }
.pill.on { background: var(--creative); color: var(--creative-ink); font-weight: 700; }
.pill.sw .dots { display: inline-flex; gap: 2px; margin-right: .45rem; vertical-align: -2px; }
.pill.sw .dots i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
.namebox { display: flex; gap: 8px; }
.namebox input { flex: 1; min-width: 0; min-height: 2.8rem; padding: .3rem .8rem; border-radius: 10px; border: 2px solid var(--info);
  background: var(--bg); color: var(--ink); font: 600 1.25rem "Bitter", Georgia, serif; text-transform: uppercase; }
.namebox input::placeholder { color: var(--ink); opacity: .75; }
.btn { min-height: 2.8rem; padding: .35rem 1.1rem; border: 0; border-radius: 10px; font: 600 1rem "Bitter", Georgia, serif; cursor: pointer;
  text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn.go { background: var(--mint); color: var(--mint-ink); }
.btn.info { background: var(--info); color: var(--info-ink); }
.btn.quiet { background: var(--quiet); color: var(--ink); }
.btn:hover { filter: brightness(1.1); }
.btn:focus-visible, .pill:focus-visible, .tab:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.acts, .nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 1rem; }
.nav { justify-content: space-between; border-top: 1px solid var(--line); padding-top: 1rem; margin-top: 1.4rem; }
.nav .btn.go { margin-left: auto; }
details.more { margin: .4rem 0; }
details.more summary { min-height: 2.6rem; display: flex; align-items: center; cursor: pointer; color: var(--info); font-weight: 600; }
.sentence { font-size: 1.5rem; margin: 0 0 1.2rem; }
.sentence .v { color: #ff7a7a; } .sentence .p { color: var(--gold); }
.dim { color: var(--dim); } .small { font-size: .85rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.card { background: var(--panel2); border-radius: 12px; padding: 14px; }
.card-h { color: var(--creative); font-weight: 700; font-size: 1.2rem; letter-spacing: .05em; }
.card .line { margin: .4rem 0 0; font-style: italic; }
.mark { display: flex; align-items: center; gap: 14px; }
.btn.go.shimmer { width: 100%; font-size: 1.35rem; min-height: 3.4rem; margin-top: 1rem; letter-spacing: .08em; }
/* The glint: the game's #1136, a BioShock pickup. A band crosses, then rests. */
.shimmer { position: relative; overflow: hidden; }
.shimmer::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, rgba(255,255,240,.55) 50%, transparent 65%);
  transform: translateX(-120%); animation: glint 3.2s ease-in-out infinite; }
@keyframes glint { 0% { transform: translateX(-120%); } 45% { transform: translateX(120%); } 100% { transform: translateX(120%); } }
@media (prefers-reduced-motion: reduce) { .shimmer::after { animation: none; } }
/* The printed #1 */
.printed { position: fixed; inset: 0; background: rgba(5,7,10,.82); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; overflow: auto; }
.printed[hidden] { display: none; }
.printed-box { background: var(--panel); border: 2px solid var(--gold); border-radius: 16px; padding: 20px; max-width: 900px; width: 100%;
  display: grid; grid-template-columns: 300px 1fr; gap: 22px; position: relative; }
@media (max-width: 700px) { .printed-box { grid-template-columns: 1fr; } .printed-cover { max-width: 280px; margin: 0 auto; } }
#printed-body { display: contents; }
.printed-words h2.gold { color: var(--gold); margin: 0 0 .3rem; font-size: 1.6rem; letter-spacing: .03em; }
.printed-words .num { font-weight: 700; } .printed-words .critic { font-style: italic; color: var(--info); }
.cta { margin-top: 1.2rem; }
.cta .btn { width: 100%; }
.soon { background: var(--panel2); border-radius: 10px; padding: .8rem 1rem; }
.close { position: absolute; top: 10px; right: 10px; }
footer { color: var(--dim); text-align: center; margin: 2rem 0 1rem; font-size: .9rem; }
/* Phone: grid children may shrink below their content, so nothing pushes the page sideways. */
.layout > *, .split > *, .cards > * { min-width: 0; }
body { overflow-x: hidden; overflow-wrap: anywhere; }
/* A pill on a card needs a ground that is not the card's own colour. */
.card .pill:not(.on) { background: var(--quiet); }


</style>
</head>

<div class="wrap">
<header class="top"><h1>Make a Comic</h1><span class="by">a hero, a villain, a year of story, and a cover · from Comic Book Studio Simulator</span></header>

<div class="layout">
<aside class="comic"><h2>YOUR COMIC</h2><div id="comic"></div></aside>
<main class="panel" id="panel" tabindex="-1"></main>
</div>
<footer>Live Culture Games · Comic Book Studio Simulator</footer>
</div>
<div class="printed" id="printed" hidden tabindex="-1" role="dialog" aria-label="Your first issue"><div class="printed-box"><button type="button" class="btn quiet close" data-act="close-printed">Close</button><div id="printed-body"></div></div></div>

<script>
(function () {
"use strict";
// ---------- deterministic picks ----------
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function pick(arr,seed,salt){return arr[hash(seed+'|'+salt)%arr.length]}
function shade(hex,f){var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;function c(x){return Math.max(0,Math.min(255,Math.round(x*f)))}return '#'+((1<<24)+(c(r)<<16)+(c(g)<<8)+c(b)).toString(16).slice(1)}
function esc(s){return String(s).replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]})}

// ---------- tables ----------
var SKIN=[['#f3d2b8','#cfa184'],['#e7b893','#b98262'],['#d9a67c','#a8764f'],['#b57a52','#86542f'],['#8d5a3b','#613a23'],['#5e3a26','#3e2416']];
var HAIRC={black:'#161212',brown:'#5a3620',auburn:'#8a3a1a',ginger:'#c0601f',blond:'#d9b25a',white:'#e8e4da',grey:'#8a8f96',blue:'#2c5aa8',green:'#3f7a2c'};
var PALETTES={'noir ice':['#16264a','#8cc4ea','#f2c230'],'ink & gold':['#1d3f8f','#f2c230','#e9e7e2'],'pillarbox':['#c8102e','#1b2a4a','#f2c230'],
 'violet night':['#7b3fb8','#1b1030','#ff7ac0'],'bottle & brass':['#1f6b3a','#c9a04a','#f0e6c8'],'candy':['#ff4fa3','#4fd0ff','#fff2a8'],
 'signal':['#f2c230','#232323','#e8492f'],'newsprint':['#cfc6ae','#2a2520','#c8102e'],'ember':['#e8492f','#2a1410','#f2c230'],'jade':['#1a8f8a','#0b2e2c','#ffe066']};
var HOUSE_FAMILY={halcyon:['ink & gold','noir ice','signal','ember'],patriot:['pillarbox','ember','ink & gold','newsprint'],prism:['violet night','candy','jade','ember'],vertex:['ember','newsprint','violet night','noir ice'],portadder:['bottle & brass','jade','newsprint'],pennant:['ember','violet night','candy'],nickel:['newsprint','signal','bottle & brass'],dragonfruit:['candy','signal','jade'],newmedia:['signal','jade','noir ice'],basement:['newsprint','noir ice','jade'],foilwrap:['candy','jade','violet night'],player:['noir ice']};
var GENRE_BG={'Adventure':['#f2c230','#1b2a4a'],'Crime':['#3a404e','#0d1016'],'Horror':['#5a2f6a','#120a18'],'Romance':['#ff7ab0','#5a1030'],'Science Fiction':['#1a8f8a','#08151e'],'War':['#a8964a','#2a2412'],'Western':['#e8904a','#4a2410'],'Teen Humour':['#4fd0ff','#ff4fa3'],'Satire':['#f2c230','#e8492f']};
// 16 species, his list plus the three he kept: "no dlc now, you can add those"
var SPECIES=['human','monkey','gorilla','bigfoot','dog','cat','bat','bird','zombie','skeleton','ghost','muck monster','robot','alien','brute','lizard'];
var FURRY={monkey:'brown',gorilla:'black',bigfoot:'auburn',dog:'blond',cat:'ginger',bat:'black',bird:'blue'};
var SP_SKIN={zombie:['#a3b38c','#72825e'],skeleton:['#ece6d6','#bdb4a0'],alien:['#9fc9a8','#6f9a7a'],robot:['#b8c0c8','#7d858f'],brute:['#7fae5a','#56813a'],lizard:['#6ab04c','#3f7a2c'],ghost:['#e8f0f4','#b8c8d0'],'muck monster':['#5f6f32','#3b471d']};

// ---------- the fields ----------
var HERO_FIELDS=[
 {k:'kind',label:'What kind of hero',opts:['Mystery man','Soldier','Scientist','Vigilante','Visitor from elsewhere','Magician','Detective','Kid wonder','Villain']},
 {k:'power',label:'What they can do',opts:['Force field','Flight','Great strength','Speed','Unseen','Fire','Ice','Mind-reading','Gadgets','Just grit']},
 {k:'stops',label:'What stops them',opts:['It does not last','Water','Their past','Silver','Bright light','Their true name','A promise']},
 {k:'palette',label:'Their colours',opts:Object.keys(PALETTES),sw:true},
 {k:'where',label:'Where they stand',opts:['Anywhere at all','The river docks','Uptown','The rooftops','The desert road','Another world']}];
var FIG_FIELDS=[
 {k:'species',label:'What they are',opts:SPECIES},
 {k:'outfit',label:'Outfit',opts:['costume','detective','military','suit','lab coat','western','robe','bare']},
 {k:'facing',label:'Facing',opts:['forward','back']},
 {k:'style',label:'Look',opts:['full','silhouette']},
 {k:'pose',label:'Pose',opts:['stand','hips','fist','point','wave','stride']},
 {k:'build',label:'Build',opts:['slim','heroic','broad']},
 {k:'scene',label:'Behind them',opts:['sunburst','city','moon','sky','flames']},
 {k:'c1',label:'Suit colour',color:true},{k:'c2',label:'Trim colour',color:true},{k:'c3',label:'Accent colour',color:true},
 {k:'silc',label:'Silhouette colour',color:true},{k:'edge',label:'Silhouette edge',color:true},
 {k:'skin',label:'Skin (people)',opts:['0','1','2','3','4','5'],swSkin:true},
 {k:'hair',label:'Hair (people)',opts:['short','bob','spiky','curls','bun','slick','bald']},
 {k:'hairc',label:'Hair or fur colour',opts:Object.keys(HAIRC),swHair:true},
 {k:'brows',label:'Brows',opts:['calm','stern','raised']},
 {k:'eyes',label:'Eyes',opts:['plain','mask','goggles','glasses','visor']},
 {k:'mouth',label:'Mouth',opts:['set','smile','grin','smirk']},
 {k:'facial',label:'Facial hair',opts:['none','moustache','beard']},
 {k:'head',label:'On their head',opts:['none','fedora','top hat','wide brim','cap','helmet','headband','halo','headset']},
 {k:'cape',label:'Cape, coat or wings',opts:['none','cape','long coat','wings']},
 {k:'emblem',label:'Chest (costume)',opts:['none','star','bolt','cross','ring','initial']},
 {k:'scarf',label:'Scarf',opts:['none','scarf']}];
var COV_FIELDS=[
 {k:'title',label:'Title on the masthead',text:true},
 {k:'issue',label:'Issue',opts:['1','2','12','47','100']},
 {k:'year',label:'Year on the stand',opts:['1938','1950','1962','1975','1988','1995','2008','2025']},
 {k:'scene',label:'Behind them',opts:['city','sunburst','moon','sky','flames']},
 {k:'band',label:'Masthead',opts:['band','box','open']},
 {k:'figure',label:'Figure',opts:['full figure','silhouette']}];
var MARK_FIELDS=[
 {k:'studio',label:'Studio name',text:true},
 {k:'shape',label:'Shape',opts:['shield','circle','diamond','banner','star']},
 {k:'letters',label:'Letters',opts:['initials','first word','none']},
 {k:'mcol',label:'Colours',opts:Object.keys(PALETTES),sw:true},
 {k:'edge',label:'Edge',opts:['single','double','none']}];
var BENCH_FIELDS={hero:HERO_FIELDS,figure:FIG_FIELDS,cover:COV_FIELDS,mark:MARK_FIELDS};

// Canon he authored: HELD from the start, because it is his.
var CANON={};

// ---------- state: embedded in the page, saved by republishing ----------
var STATE={st:{},notes:'',cnotes:{}};
try{var raw=document.getElementById('cs-state');if(raw&&raw.textContent.trim())STATE=JSON.parse(raw.textContent)}catch(e){}
STATE.st=STATE.st||{};STATE.cnotes=STATE.cnotes||{};STATE.notes=STATE.notes||'';
var SAVED=JSON.stringify(STATE);
function initials(s){return s.replace(/[^A-Za-z ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0].toUpperCase()}).join('')||'?'}

function slot(c,b){STATE.st[c.id]=STATE.st[c.id]||{};if(!STATE.st[c.id][b]){var canon=(CANON[c.id]||{})[b]||{};STATE.st[c.id][b]={roll:0,held:Object.assign({},canon)}}return STATE.st[c.id][b]}
function val(c,b,k){var s=slot(c,b);if(k in s.held)return s.held[k];return derive(b,k,c,s.roll)}
function values(c,b){var o={};BENCH_FIELDS[b].forEach(function(f){o[f.k]=val(c,b,f.k)});return o}
function palOf(c){return [val(c,'figure','c1'),val(c,'figure','c2'),val(c,'figure','c3')]}

// ---------- AUTO ----------
function derive(bench,k,c,roll){
 var seed=c.id+'#'+(roll||0),villain=c.role==='villain',n=c.name;
 if(bench==='hero'){
  if(k==='kind')return villain?'Villain':pick(HERO_FIELDS[0].opts.slice(0,8),seed,k);
  if(k==='palette')return roll?pick(Object.keys(PALETTES),seed,k):pick(HOUSE_FAMILY[c.house]||['noir ice'],c.id,'pal');
  var f=HERO_FIELDS.filter(function(x){return x.k===k})[0];return pick(f.opts,seed,k);
 }
 if(bench==='figure'){
  var era=c.year,sp=k==='species'?'':val(c,'figure','species'),outfit;
  if(k==='species'){if(villain)return pick(['human','human','zombie','skeleton','alien','robot','muck monster','brute','lizard','ghost'],c.id+roll,'sp');if(c.genre==='Science Fiction')return pick(['human','human','human','robot','alien'],c.id+roll,'sp');return 'human'}
  if(k==='outfit'){
   if(/\bagent\b|\bmr\b|vance|diplomat/i.test(n))return 'suit';
   if(/doctor|\bdr\b/i.test(n))return 'lab coat';
   if(/reverend|father|parish|choir|vigil/i.test(n))return 'robe';
   if(/deputy|sheriff|marshal|dust/i.test(n))return 'western';
   if(/\blt\b|sgt|sergeant|colonel|private|marine|muster/i.test(n))return 'military';
   if(sp==='gorilla'||sp==='bigfoot'||sp==='muck monster'||sp==='ghost')return 'bare';
   if(villain)return pick(['costume','costume','suit','robe','bare'],seed,k);
   return era<1950?pick(['costume','costume','detective','suit'],seed,k):'costume';
  }
  if(k==='facing')return 'forward';
  if(k==='style')return 'full';
  if(k==='c1'||k==='c2'||k==='c3'){var P=PALETTES[val(c,'hero','palette')]||PALETTES['noir ice'];return P[+k[1]-1]}
  if(k==='silc')return '#0b0f14';
  if(k==='edge'){var P2=PALETTES[val(c,'hero','palette')]||PALETTES['noir ice'];return P2[2]}
  if(k==='scene')return pick(({'Crime':['city','moon'],'Horror':['moon','flames'],'Science Fiction':['sky','sunburst'],'War':['flames','sky','sunburst'],'Western':['sky','sunburst']})[c.genre]||['sunburst','city','sky'],seed,k);
  if(k==='hairc'&&FURRY[sp])return FURRY[sp];
  if(k==='head'){outfit=val(c,'figure','outfit');if(outfit==='detective')return 'fedora';if(outfit==='military')return 'helmet';if(outfit==='western')return 'wide brim';
   if(sp!=='human')return 'none';
   if(era<1950)return pick(['none','top hat','fedora','cap','none'],seed,k);if(era<1990)return pick(['none','helmet','headband','none'],seed,k);return pick(['none','headset','helmet','none'],seed,k)}
  if(k==='cape'){if(sp==='bat'||sp==='bird')return 'wings';outfit=val(c,'figure','outfit');if(outfit!=='costume')return 'none';return era<1970?pick(['cape','none','cape'],seed,k):pick(['none','cape'],seed,k)}
  if(k==='facial')return pick(['none','none','none','moustache','beard'],seed,k);
  if(k==='eyes')return villain?pick(['glasses','visor','plain','mask'],seed,k):pick(['plain','plain','mask','goggles'],seed,k);
  if(k==='brows')return villain?'stern':pick(['calm','stern','raised'],seed,k);
  if(k==='mouth')return villain?'smirk':pick(['set','smile','grin','smirk'],seed,k);
  if(k==='scarf')return pick(['none','none','scarf'],seed,k);
  var f2=FIG_FIELDS.filter(function(x){return x.k===k})[0];return f2.opts?pick(f2.opts,seed,k):'';
 }
 if(bench==='cover'){
  if(k==='title')return c.book||c.name;
  if(k==='issue')return roll?pick(['1','2','12','47','100'],seed,k):'1';
  if(k==='year'){var ys=COV_FIELDS[2].opts.map(Number),best=ys[0];ys.forEach(function(y){if(Math.abs(y-c.year)<Math.abs(best-c.year))best=y});return String(best)}
  if(k==='scene')return val(c,'figure','scene');
  if(k==='band')return pick(['band','band','box','open'],seed,k);
  if(k==='figure')return val(c,'figure','style')==='silhouette'?'silhouette':'full figure';
 }
 if(bench==='mark'){
  if(k==='studio')return c.houseName.replace(' (yours)','');
  if(k==='shape')return pick(['shield','circle','diamond','banner','star'],c.house+'#'+(roll||0),k);
  if(k==='letters')return 'initials';
  if(k==='mcol')return roll?pick(Object.keys(PALETTES),c.house+'#'+roll,k):(HOUSE_FAMILY[c.house]||['noir ice'])[0];
  if(k==='edge')return pick(['single','double'],c.house+'#'+(roll||0),k);
 }
 return '';
}

function title() { return BOOK.title || heroName(); }
// Keep the drawing core's characters in step with the walk before every draw.
function sync() {
  [BOOK.hero, BOOK.villain].forEach(function (c) { c.genre = BOOK.genre; c.year = +BOOK.year; c.houseName = studioName(); });
  BOOK.hero.drawnName = heroName(); BOOK.villain.drawnName = villainName();
  BOOK.hero.book = title();
  var cov = slot(BOOK.hero, 'cover').held;
  cov.title = title(); cov.issue = '1'; cov.year = BOOK.year;
  if (!BOOK.spine) BOOK.spine = CARDS.map(function (c, i) { return {does: VERBS[c[3]][0], main: i === 1 ? 'villain' : 'hero'}; });
}
function nm(c) { return c === BOOK.hero ? heroName() : villainName(); }
function other(who) { return who === 'hero' ? 'villain' : 'hero'; }
// The short lists are his base verbs; a sentence needs them said of one person.
function says(v) { if (/ on$/.test(v) || /s$/.test(v)) return v; return v + 's'; }
function whoName(who) { return who === 'hero' ? heroName() : villainName(); }

// ---------- save: this browser only ----------
function store() { try { BOOK.st = STATE.st; localStorage.setItem(STORE_KEY, JSON.stringify(BOOK)); } catch (e) {} }
function load() {
  try { var raw = localStorage.getItem(STORE_KEY); if (raw) { var b = JSON.parse(raw); if (b && b.hero && b.villain) { BOOK = b; STATE.st = b.st || {}; return; } } } catch (e) {}
  BOOK = fresh(); STATE.st = {};
}

// ---------- small drawing helpers ----------
function el(id) { return document.getElementById(id); }
function h(tag, cls, html) { return '<' + tag + (cls ? ' class="' + cls + '"' : '') + '>' + (html || '') + '</' + tag + '>'; }
function pills(group, opts, chosen, labels) {
  return '<div class="pills" role="group">' + opts.map(function (o, i) {
    return '<button type="button" class="pill' + (String(o) === String(chosen) ? ' on' : '') + '" data-g="' + esc(group) + '" data-v="' + esc(o) + '" aria-pressed="' + (String(o) === String(chosen)) + '">' + esc(labels ? labels[i] : o) + '</button>';
  }).join('') + '</div>';
}
function swatches(group, chosen) {
  return '<div class="pills">' + Object.keys(PALETTES).map(function (k) {
    var p = PALETTES[k];
    return '<button type="button" class="pill sw' + (k === chosen ? ' on' : '') + '" data-g="' + group + '" data-v="' + esc(k) + '" aria-pressed="' + (k === chosen) + '"><span class="dots">' + p.map(function (c) { return '<i style="background:' + c + '"></i>'; }).join('') + '</span>' + esc(k) + '</button>';
  }).join('') + '</div>';
}
function row(label, inner) { return '<div class="row"><div class="lab">' + esc(label) + '</div>' + inner + '</div>'; }
function nameRow(label, id, value, placeholder) {
  return row(label, '<div class="namebox"><input id="' + id + '" value="' + esc(value) + '" placeholder="' + esc(placeholder) + '" maxlength="28" autocomplete="off"><button type="button" class="btn info" data-act="roll-' + id + '">Roll</button></div>');
}

// ---------- the panels ----------
function figOpts(k) { return FIG_FIELDS.filter(function (f) { return f.k === k; })[0].opts; }
function characterPanel(c, who) {
  var hv = values(c, 'hero'), fv = values(c, 'figure');
  var named = who === 'hero' ? BOOK.hero.name : BOOK.villain.name;
  var s = h('h2', 'step-title', who === 'hero' ? 'Who is your hero?' : 'Who stands against them?');
  s += '<div class="split"><div class="figure-frame">' + figureSVG(Object.assign({}, c, {name: nm(c)})) + '</div><div class="fields">';
  s += nameRow('NAME', 'name-' + who, named, nm(c));
  if (who === 'hero') s += row('WHAT KIND', pills(who + ':hero:kind', HERO_FIELDS[0].opts.slice(0, 8), hv.kind));
  s += row('WHAT THEY CAN DO', pills(who + ':hero:power', HERO_FIELDS[1].opts, hv.power));
  if (who === 'hero') s += row('WHAT STOPS THEM', pills(who + ':hero:stops', HERO_FIELDS[2].opts, hv.stops));
  s += row('THEIR COLOURS', swatches(who + ':hero:palette', hv.palette));
  s += '<details class="more"' + (who === 'hero' ? ' open' : '') + '><summary>How they look</summary>';
  s += row('WHAT THEY ARE', pills(who + ':figure:species', SPECIES, fv.species));
  s += row('OUTFIT', pills(who + ':figure:outfit', figOpts('outfit'), fv.outfit));
  s += row('POSE', pills(who + ':figure:pose', figOpts('pose'), fv.pose));
  s += row('BUILD', pills(who + ':figure:build', figOpts('build'), fv.build));
  s += row('ON THEIR HEAD', pills(who + ':figure:head', figOpts('head'), fv.head));
  s += row('CAPE, COAT OR WINGS', pills(who + ':figure:cape', figOpts('cape'), fv.cape));
  s += row('EYES', pills(who + ':figure:eyes', figOpts('eyes'), fv.eyes));
  s += row('CHEST', pills(who + ':figure:emblem', figOpts('emblem'), fv.emblem));
  s += row('SKIN', pills(who + ':figure:skin', figOpts('skin'), fv.skin, ['lightest', 'light', 'medium', 'tan', 'brown', 'deep']));
  s += row('HAIR', pills(who + ':figure:hair', figOpts('hair'), fv.hair));
  s += '</details>';
  s += '<div class="acts"><button type="button" class="btn info" data-act="roll-' + who + '">Roll everything</button></div>';
  return s + '</div></div>';
}
function conflictPanel() {
  var s = h('h2', 'step-title', 'What is at stake?');
  s += '<p class="sentence">' + h('b', 'v', esc(villainName())) + ' ' + esc(BOOK.threat) + ' ' + h('b', 'p', esc(BOOK.stake)) + '.</p>';
  s += row('WHAT THE VILLAIN DOES', pills('threat', VERBS.turn.concat(['destroy']), BOOK.threat));
  s += row('WHERE', pills('stake', PLACES, BOOK.stake));
  return s;
}
function spinePanel() {
  var s = h('h2', 'step-title', 'Your first twelve issues') + '<p class="dim">Four cards. Each one is a quarter of the year.</p><div class="cards">';
  BOOK.spine.forEach(function (card, i) {
    var c = CARDS[i];
    s += '<div class="card"><div class="card-h">' + c[1] + '</div><div class="dim small">' + c[2] + '</div>';
    s += row('WHO ACTS', pills('spine:' + i + ':main', ['hero', 'villain'], card.main, [heroName(), villainName()]));
    s += row('DOES', pills('spine:' + i + ':does', VERBS[c[3]], card.does));
    s += '<p class="line">' + esc(whoName(card.main)) + ' ' + esc(says(card.does)) + ' ' + esc(whoName(other(card.main))) + '.</p></div>';
  });
  return s + '</div>';
}
function coverPanel() {
  var v = values(BOOK.hero, 'cover');
  var s = h('h2', 'step-title', 'What sells issue #1?');
  s += row('TITLE ON THE MASTHEAD', '<div class="namebox"><input id="title" value="' + esc(BOOK.title) + '" placeholder="' + esc(heroName()) + '" maxlength="24" autocomplete="off"></div>');
  s += row('ON THE STAND IN', pills('year', ERAS.map(function (e) { return e[0]; }), BOOK.year, ERAS.map(function (e) { return e[0] + ' · ' + e[1]; })));
  s += row('BEHIND THEM', pills('hero:figure:scene', figOpts('scene'), values(BOOK.hero, 'figure').scene));
  s += row('MASTHEAD', pills('hero:cover:band', COV_FIELDS[4].opts, v.band, ['colour band', 'boxed', 'open']));
  s += row('THE FIGURE', pills('hero:cover:figure', COV_FIELDS[5].opts, v.figure));
  return s;
}
function runPanel() {
  var s = h('h2', 'step-title', 'Run the book');
  s += nameRow('YOUR STUDIO', 'studio', BOOK.studio, studioName());
  s += row('GENRE', pills('genre', GENRES, BOOK.genre));
  s += row('YOUR MARK', '<div class="mark">' + markSVG(BOOK.hero, 88) + '<button type="button" class="btn info" data-act="roll-mark">Roll the mark</button></div>');
  s += '<button type="button" class="btn go shimmer" data-act="greenlight">GREENLIGHT</button>';
  return s;
}
var PANELS = {hero: function () { return characterPanel(BOOK.hero, 'hero'); }, villain: function () { return characterPanel(BOOK.villain, 'villain'); }, conflict: conflictPanel, spine: spinePanel, cover: coverPanel, run: runPanel};

// ---------- your comic: always beside the step ----------
function yourComic() {
  var s = '<div class="cover-frame">' + coverSVG(Object.assign({}, BOOK.hero, {name: heroName()})) + '</div>';
  s += '<dl class="facts">';
  s += '<dt>HERO</dt><dd>' + esc(heroName()) + ' · ' + esc(values(BOOK.hero, 'hero').power) + '</dd>';
  if (BOOK.visited.villain) s += '<dt>VILLAIN</dt><dd>' + esc(villainName()) + ' · ' + esc(values(BOOK.villain, 'hero').power) + '</dd>';
  if (BOOK.visited.conflict) s += '<dt>AT STAKE</dt><dd>' + esc(villainName()) + ' ' + esc(BOOK.threat) + ' ' + esc(BOOK.stake) + '</dd>';
  if (BOOK.visited.spine) s += '<dt>STORY</dt><dd>' + BOOK.spine.map(function (c) { return esc(whoName(c.main)) + ' ' + esc(says(c.does)) + ' ' + esc(whoName(other(c.main))); }).join(' · ') + '</dd>';
  return s + '</dl>';
}

// ---------- the printed #1: every word derived from what was chosen ----------
var CRITICS = ['Walt Emery', 'June Castellano', 'Hal Brixton', 'Ruth Okafor', 'Benny Zhang', 'Marta Voss'];
var PRAISE = ['a book with a spine', 'the best first issue this month', 'a hero worth a dime', 'pulp with a heartbeat', 'a real page-turner'];
function printedLines() {
  var key = heroName() + villainName() + BOOK.stake + BOOK.genre + BOOK.year + JSON.stringify(BOOK.spine);
  var n = hash(key), copies = 28000 + (n % 34) * 1000, sold = Math.round(copies * (0.62 + (n >> 8) % 30 / 100));
  return {
    headline: title().toUpperCase() + ' #1 HITS THE STAND',
    when: 'On sale ' + BOOK.year + ' · ' + studioName(),
    synopsis: esc(heroName()) + ' faces ' + esc(villainName()) + ', who ' + esc(BOOK.threat) + ' ' + esc(BOOK.stake) + '. ' +
      BOOK.spine.map(function (c, i) { return CARDS[i][1].charAt(0) + CARDS[i][1].slice(1).toLowerCase() + ': ' + esc(whoName(c.main)) + ' ' + esc(says(c.does)) + ' ' + esc(whoName(other(c.main))) + '.'; }).join(' '),
    numbers: 'Printed ' + copies.toLocaleString() + ' · sold ' + sold.toLocaleString(),
    critic: '“' + pick(PRAISE, key, 'p') + '” — ' + pick(CRITICS, key, 'c')
  };
}

// ---------- draw ----------
function draw() {
  sync();
  el('steps').innerHTML = STEPS.map(function (st) {
    var cls = st[0] === BOOK.step ? 'on' : BOOK.visited[st[0]] ? 'done' : '';
    return '<button type="button" class="tab ' + cls + '" data-step="' + st[0] + '" aria-selected="' + (st[0] === BOOK.step) + '">' + st[1] + '</button>';
  }).join('');
  el('panel').innerHTML = PANELS[BOOK.step]() + navRow();
  el('comic').innerHTML = yourComic();
  el('printed').hidden = !BOOK.printed;
  if (BOOK.printed) drawPrinted();
  store();
}
function navRow() {
  var i = STEPS.map(function (s) { return s[0]; }).indexOf(BOOK.step);
  var s = '<div class="nav">';
  if (i > 0) s += '<button type="button" class="btn quiet" data-act="back">◂ Back</button>';
  if (i < STEPS.length - 1) s += '<button type="button" class="btn go" data-act="next">Next: ' + STEPS[i + 1][1] + ' ▸</button>';
  return s + '</div>';
}
function drawPrinted() {
  var p = printedLines();
  el('printed-body').innerHTML = '<div class="printed-cover">' + coverSVG(Object.assign({}, BOOK.hero, {name: heroName()})) + '</div><div class="printed-words">' +
    h('h2', 'gold', esc(p.headline)) + h('p', 'dim', esc(p.when)) + h('p', '', p.synopsis) + h('p', 'num', esc(p.numbers)) + h('p', 'critic', esc(p.critic)) +
    '<div class="acts"><button type="button" class="btn go" data-act="download">Save the cover</button><button type="button" class="btn info" data-act="again">Make another comic</button></div>' +
    '<div class="cta">' + (STEAM_URL ? '<a class="btn go shimmer" href="' + esc(STEAM_URL) + '" target="_blank" rel="noopener">Run a whole studio: wishlist ' + esc(GAME_NAME) + ' on Steam</a>' : '<div class="soon">Run a whole studio for a hundred years in <b>' + esc(GAME_NAME) + '</b>, coming to Steam.</div>') + '</div></div>';
}

// ---------- act ----------
function setField(group, v) {
  var parts = group.split(':');
  if (parts[0] === 'spine') { BOOK.spine[+parts[1]][parts[2]] = v; return; }
  if (parts.length === 3) { var c = parts[0] === 'hero' ? BOOK.hero : BOOK.villain; slot(c, parts[1]).held[parts[2]] = v; return; }
  if (group === 'threat') BOOK.threat = v; else if (group === 'stake') BOOK.stake = v; else if (group === 'genre') BOOK.genre = v; else if (group === 'year') BOOK.year = v;
}
function go(step) { BOOK.step = step; BOOK.visited[step] = true; draw(); el('panel').focus({preventScroll: true}); window.scrollTo({top: 0, behavior: 'smooth'}); }
function rollCharacter(c) { var s = slot(c, 'figure'); s.roll++; s.held = {}; var hs = slot(c, 'hero'); hs.roll++; hs.held = {}; }
function act(a) {
  var order = STEPS.map(function (s) { return s[0]; }), i = order.indexOf(BOOK.step);
  if (a === 'next') return go(order[i + 1]);
  if (a === 'back') return go(order[i - 1]);
  if (a === 'roll-name-hero') { BOOK.hero.name = ''; BOOK.heroRoll++; }
  if (a === 'roll-name-villain') { BOOK.villain.name = ''; BOOK.villainRoll++; }
  if (a === 'roll-studio') { BOOK.studio = ''; BOOK.studioRoll++; }
  if (a === 'roll-hero') rollCharacter(BOOK.hero);
  if (a === 'roll-villain') rollCharacter(BOOK.villain);
  if (a === 'roll-mark') { var m = slot(BOOK.hero, 'mark'); m.roll++; m.held = {}; }
  if (a === 'greenlight') { STEPS.forEach(function (s) { BOOK.visited[s[0]] = true; }); BOOK.printed = true; draw(); el('printed').focus(); return; }
  if (a === 'close-printed') { BOOK.printed = false; }
  if (a === 'again') { BOOK = fresh(); STATE.st = {}; }
  if (a === 'download') return downloadCover();
  draw();
}
function downloadCover() {
  var svg = el('printed-body').querySelector('svg');
  if (!svg) return;
  var src = new XMLSerializer().serializeToString(svg);
  if (src.indexOf('xmlns=') < 0) src = src.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  var img = new Image();
  img.onload = function () {
    var cv = document.createElement('canvas'); cv.width = 800; cv.height = 1200;
    var cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, 800, 1200);
    cv.toBlob(function (b) {
      var a = document.createElement('a'); a.href = URL.createObjectURL(b);
      a.download = title().replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() + '-1.png';
      document.body.appendChild(a); a.click(); a.remove();
    }, 'image/png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
}

// ---------- wire once (the root is drawn on load; events are delegated) ----------
function boot() {
  load();
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button,[data-act]');
    if (!t) return;
    if (t.dataset.step) return go(t.dataset.step);
    if (t.dataset.g) { setField(t.dataset.g, t.dataset.v); return draw(); }
    if (t.dataset.act) act(t.dataset.act);
  });
  document.addEventListener('input', function (e) {
    var id = e.target.id, v = e.target.value.trim();
    if (id === 'name-hero') BOOK.hero.name = v; else if (id === 'name-villain') BOOK.villain.name = v; else if (id === 'studio') BOOK.studio = v; else if (id === 'title') BOOK.title = v; else return;
    sync(); el('comic').innerHTML = yourComic(); store();
    var fig = el('panel').querySelector('.figure-frame'); if (fig && (id === 'name-hero' || id === 'name-villain')) fig.innerHTML = figureSVG(Object.assign({}, id === 'name-hero' ? BOOK.hero : BOOK.villain, {name: v || '?'}));
    if (id === 'studio') { var mk = el('panel').querySelector('.mark svg'); if (mk) mk.outerHTML = markSVG(BOOK.hero, 88); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && BOOK.printed) act('close-printed'); });
  // A link can open a step: #conflict, #spine, #cover, #run, or #printed for the finished #1.
  var want = (location.hash || '').slice(1);
  if (want === 'printed') { STEPS.forEach(function (s) { BOOK.visited[s[0]] = true; }); BOOK.step = 'run'; BOOK.printed = true; }
  else if (PANELS[want]) { BOOK.step = want; BOOK.visited[want] = true; }
  draw();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
</body>
</html>
