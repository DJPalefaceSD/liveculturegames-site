<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Culture Games</title>
<meta name="description" content="Live Culture Games is a small game studio in Escondido, California. Five little sites to play with. Something is fermenting.">
<meta property="og:title" content="Live Culture Games">
<meta property="og:description" content="A small game studio in Escondido, California. Five little sites to play with. Something is fermenting.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://liveculturegames.com/">
<meta property="og:image" content="https://liveculturegames.com/cup-360.png">
<link rel="icon" type="image/png" href="cup-360.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* FIVE SITES, ONE BAR. His words, 3 Oct 2026: "make it the 5 seprate sites,
     dont make them just skins. All 5 are entertaining and have merit to I want
     to let people play with them."

     Each site is whole and untouched under sites/; this page is only the bar
     that picks which one fills the window, like the game's skin chooser.
     ?site=arcade in the address opens that one, so a link can point at any of
     the five. Each also stands alone at its own address: /sites/arcade.html. */
  :root {
    color-scheme: dark;
    --bar: #111014;
    --edge: #3a3540;
    --ink: #ffffff;
    --dim: #e2dce8;
    --pink: #ff1493;
    --chip: #1d1a22;
    --bar-h: 68px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bar); }
  body { display: flex; flex-direction: column; font-family: Nunito, system-ui, sans-serif; color: var(--ink); }

  .bar {
    flex: 0 0 auto;
    height: var(--bar-h);
    display: flex; align-items: center; gap: 14px;
    padding: 0 16px;
    background: var(--bar);
    border-bottom: 3px solid var(--pink);
    position: relative; z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; text-decoration: none; color: var(--ink); }
  .brand img { width: 46px; height: auto; display: block; transition: transform .25s; }
  .brand:hover img { transform: rotate(-8deg) scale(1.06); }
  .brand span { font-family: Fredoka, Nunito, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .02em; white-space: nowrap; }
  .label { font-weight: 800; font-size: 18px; color: var(--dim); white-space: nowrap; margin-left: auto; }

  .chips {
    display: flex; gap: 8px; flex: 0 1 auto; min-width: 0;
    overflow-x: auto; scrollbar-width: none; padding: 4px 2px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 6px 16px 6px 8px;
    border-radius: 999px;
    border: 2px solid var(--edge);
    background: var(--chip); color: var(--ink);
    font: 800 18px Nunito, system-ui, sans-serif;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .chip:hover { border-color: var(--pink); transform: translateY(-1px); }
  .chip:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .chip[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: #fff; }
  .sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #000; flex: 0 0 auto; box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }

  .stage { flex: 1 1 auto; position: relative; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #fff; }

  @media (max-width: 960px) {
    .label, .brand span { display: none; }
  }
  /* On a phone all five must show at once — a chip off the edge is a site a
     friend never finds. The cup steps aside, the swatches go, and the five
     share the width equally. */
  @media (max-width: 560px) {
    :root { --bar-h: 60px; }
    .bar { padding: 0 8px; gap: 0; }
    .brand { display: none; }
    .chips { flex: 1 1 auto; gap: 4px; padding: 0; overflow: visible; }
    .chip { flex: 1 1 0; justify-content: center; min-width: 0; padding: 6px 2px; font-size: 16px; }
    .sw { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .brand img, .chip { transition: none; }
  }
</style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="./" aria-label="Live Culture Games, home">
      <img src="cup-360.png" alt="">
      <span>Live Culture Games</span>
    </a>
    <span class="label" id="pick">Five sites — pick one</span>
    <nav class="chips" aria-labelledby="pick" id="chips"></nav>
  </header>
  <main class="stage">
    <iframe id="frame" title="Live Culture Games" allow="autoplay"></iframe>
  </main>
<script>
  // The five sites, in the order the bar shows them. The swatch is two of the
  // site's own colours so a chip can be told apart before its word is read.
  var SITES = [
    { id: "lab",     name: "Lab",     file: "sites/lab.html",     a: "#ffffff", b: "#63aed8" },
    { id: "arcade",  name: "Arcade",  file: "sites/arcade.html",  a: "#ff1493", b: "#1a0b2e" },
    { id: "desktop", name: "Desktop", file: "sites/desktop.html", a: "#eef2f8", b: "#ff1493" },
    { id: "toybox",  name: "Toybox",  file: "sites/toybox.html",  a: "#fff6e8", b: "#ff1493" },
    { id: "space",   name: "Space",   file: "sites/space.html",   a: "#0b1024", b: "#ff1493" }
  ];
  var KEY = "lcg-site";
  var frame = document.getElementById("frame");
  var chips = document.getElementById("chips");

  function remembered() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }
  function remember(id) {
    try { localStorage.setItem(KEY, id); } catch (e) {}
  }
  function find(id) {
    for (var i = 0; i < SITES.length; i++) if (SITES[i].id === id) return SITES[i];
    return null;
  }

  SITES.forEach(function (site) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.dataset.site = site.id;
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = '<span class="sw" style="background:linear-gradient(135deg,' + site.a + ' 50%,' + site.b + ' 50%)"></span>' + site.name;
    b.addEventListener("click", function () { show(site.id, true); });
    chips.appendChild(b);
  });

  // Arrow keys walk the chips, the same as a row of tabs.
  chips.addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var all = Array.prototype.slice.call(chips.querySelectorAll(".chip"));
    var at = all.indexOf(document.activeElement);
    if (at < 0) return;
    var next = all[(at + (e.key === "ArrowRight" ? 1 : all.length - 1)) % all.length];
    next.focus();
    show(next.dataset.site, true);
    e.preventDefault();
  });

  function show(id, fromClick) {
    var site = find(id) || SITES[0];
    if (frame.getAttribute("src") !== site.file) frame.setAttribute("src", site.file);
    Array.prototype.forEach.call(chips.querySelectorAll(".chip"), function (c) {
      var on = c.dataset.site === site.id;
      c.setAttribute("aria-pressed", on ? "true" : "false");
      if (on && fromClick && c.scrollIntoView) c.scrollIntoView({ block: "nearest", inline: "nearest" });
    });
    remember(site.id);
    var url = new URL(location.href);
    url.searchParams.set("site", site.id);
    history.replaceState(null, "", url);
  }

  // A link inside a site that leaves it (the Figure Bench, another page) opens
  // in the whole window, never inside the frame.
  frame.addEventListener("load", function () {
    try {
      var doc = frame.contentDocument;
      Array.prototype.forEach.call(doc.querySelectorAll('a[href^="/"], a[href^="http"]'), function (a) {
        a.target = "_top";
      });
    } catch (e) {}
  });

  var asked = new URLSearchParams(location.search).get("site");
  show(find(asked) ? asked : (find(remembered()) ? remembered() : SITES[0].id), false);
</script>
</body>
</html>
